# Singapore merchants as they appear on card statements.
#
# Matching works on the "squashed" descriptor (letters and digits only, upper
# case): `prefix` = the processor/platform prefix before * / _ (FP*, GRAB*),
# `starts` = the merchant name starts with it, `contains` = anywhere in the
# raw descriptor (use ≥ 5 characters), `exact` = the whole name.
# `check: true` flags entries the user should confirm (e.g. Grab: ride or food).
# Order matters: the first match wins.
brands:
  # --- platforms & delivery
  - { name: foodpanda, category: delivery, prefix: [FP], contains: [FOODPANDA] }
  - { name: Deliveroo, category: delivery, contains: [DELIVEROO] }
  - { name: GrabFood, category: delivery, contains: [GRABFOOD] }
  - { name: GrabMart, category: groceries, contains: [GRABMART] }
  - { name: Grab, category: rides, check: true, prefix: [GRAB], starts: [GRAB] }
  - { name: Gojek, category: rides, contains: [GOJEK] }
  - { name: TADA, category: rides, starts: [TADA] }
  - { name: Ryde, category: rides, starts: [RYDE] }
  - { name: CDG Zig, category: rides, contains: [COMFORTDELGRO, CDGTAXI, CDGZIG, COMFORTTAXI, CITYCAB] }
  - { name: Amazon Prime, category: subscriptions, starts: [AMZNPRIME, AMAZONPRIME, PRIMEVIDEO] }
  - { name: Amazon, category: shopping, prefix: [AMZN, AMAZON MAR, AMAZON], starts: [AMAZON, AMZN] }
  - { name: Shopee, category: shopping, contains: [SHOPEE] }
  - { name: Lazada, category: shopping, contains: [LAZADA] }
  - { name: Taobao, category: shopping, contains: [TAOBAO] }
  - { name: Qoo10, category: shopping, contains: [QOO10] }
  - { name: Temu, category: shopping, starts: [TEMU] }
  - { name: AliExpress, category: shopping, contains: [ALIEXPRESS] }
  - { name: Carousell, category: shopping, contains: [CAROUSELL] }

