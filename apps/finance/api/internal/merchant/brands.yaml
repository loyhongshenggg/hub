# Generic words: the category is clear even when the merchant isn't. The
# display name stays the cleaned descriptor. Lower confidence than brands.
keywords:
  - { category: health, words: [DENTAL, DENTIST, CLINIC, MEDICAL, POLYCLINIC, PHARMACY, HOSPITAL, OPTICAL, PHYSIO, CHIRO] }
  - { category: insurance, words: [INSURANCE, ASSURANCE] }
  - { category: bills, words: [TELECOM, MOBILE PLAN, BROADBAND, UTILITIES] }
  - { category: dining, words: [KITCHEN, RESTAURANT, CAFE, COFFEE, BAKERY, NOODLE, LAKSA, BAK KUT TEH, CHICKEN RICE, SUSHI, RAMEN, PIZZA, BURGER, STEAK, CUISINE, CUISI, EATERY, BISTRO, HAWKER, FOOD COURT, DIM SUM, HOTPOT, BBQ, TEA HOUSE, LAO MIAN, CANTEEN, DELI, FOOD, F&B, CATERING, YOGURT, DESSERT, ICE CREAM, GELATO] }
