  - { category: personal, words: [SALON, BARBER, HAIR, BEAUTY, NAIL, SPA, MASSAGE, COSMETIC] }
  - { category: rides, words: [TAXI, CAB] }
  - { category: transport, words: [TRANSPORT, BUS SERVICE] }
