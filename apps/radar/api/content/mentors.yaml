# The people Radar's courses are built around, plus gap fillers. Feeds bring
# in their new work automatically ("Fresh from …" steps and News). Avatars
# are public GitHub or YouTube channel pictures (checked 2026-11-21); the API
# caches them.
mentors:
  - id: lauren-tan
    name: Lauren Tan
    avatar: 'https://github.com/poteto.png?size=128'
    handle: poteto
    role: Engineer on AI coding agents; React Compiler core team
    focus: Verification-first agentic engineering — every correction becomes a deterministic check.
    area: ai-swe
    links:
      - { label: X, url: 'https://x.com/poteto' }
      - { label: GitHub, url: 'https://github.com/poteto' }
    feeds: [] # no blog or feed; talks are curated by hand

  - id: rehberger
    name: Johann Rehberger
    avatar: 'https://yt3.googleusercontent.com/imsZDUkdjQsq2tIvoc7CI3lsuuRWDHUg1yPph3eUDnYaT9OWHdEtnXnPzjzcWI891iASf8XQow=s128-c-k-c0x00ffffff-no-rj' # Embrace The Red channel picture
    handle: Embrace The Red
    role: Independent AI red teamer; built red teams at Microsoft, Uber and EA
    focus: Prompt injection, data exfiltration and exploits in AI agents and coding assistants.
    area: ai-security
    links:
      - { label: Blog, url: 'https://embracethered.com/blog/' }
      - { label: YouTube, url: 'https://www.youtube.com/@embracethered' }
    feeds:
      - {
          url: 'https://embracethered.com/blog/index.xml',
          type: post,
          topics: [prompt-injection],
        }
      - {
          url: 'https://www.youtube.com/feeds/videos.xml?channel_id=UCSwcJXQWE6GWu9IKc0QwO5g',
          type: video,
          topics: [prompt-injection],
        }

  - id: carlini
    name: Nicholas Carlini
    avatar: 'https://github.com/carlini.png?size=128'
    role: Research scientist at Anthropic (previously Google DeepMind)
    focus: Adversarial ML, data poisoning, and LLM-driven vulnerability discovery.
    area: ai-security
    links:
      - { label: Website, url: 'https://nicholas.carlini.com/' }
    feeds:
      - {
          url: 'https://nicholas.carlini.com/writing/feed.xml',
          type: post,
          topics: [adversarial-ml],
        }

  - id: pwn-college
    name: pwn.college
    avatar: 'https://github.com/pwncollege.png?size=128'
    handle: Yan Shoshitaishvili
    role: ASU's free hacking curriculum; Shellphish / AIxCC
    focus: Hands-on fundamentals — Linux, assembly, web, reversing, binary exploitation.
    area: offense
    links:
      - { label: Dojos, url: 'https://pwn.college/dojos' }
      - { label: YouTube, url: 'https://www.youtube.com/@pwncollege' }
    feeds:
      - {
          url: 'https://www.youtube.com/feeds/videos.xml?channel_id=UCBaWwFw7KmCN8YlfX4ERYKg',
          type: video,
          topics: [binary-exploitation],
        }

  - id: hammond
    name: John Hammond
    avatar: 'https://github.com/JohnHammond.png?size=128'
    role: Security researcher at Huntress
    focus: Malware analysis, threat hunting and CTFs, explained on video.
    area: defense
    links:
      - { label: YouTube, url: 'https://www.youtube.com/@_JohnHammond' }
    feeds:
      - {
          url: 'https://www.youtube.com/feeds/videos.xml?channel_id=UCVeW9qkBjo3zosnqUbG7CFw',
          type: video,
          topics: [malware-analysis],
        }

