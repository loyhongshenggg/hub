# Test fixture: a static web server plus a sidecar that must reach it over
# the project's default network (proves the core override keeps it).
services:
  web:
    image: busybox:1.37
    command: httpd -f -v -p 8080 -h /www
    volumes: ["./www:/www:ro"]
  sidecar:
    image: busybox:1.37
    command: sh -c 'until wget -qO- http://web:8080/healthz; do sleep 0.2; done; echo; echo SIDECAR_OK; exec sleep 3600'
    environment:
      FROM_APP: yes
