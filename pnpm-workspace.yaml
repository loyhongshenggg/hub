packages:
  - 'platform/*'
  - 'apps/*'
  - 'apps/*/web'
  - 'libs/*'
  - 'libs/*/ts'
  - 'tools/*'

autoInstallPeers: true
allowBuilds:
  nx: true
  # gonx loads the prebuilt tree-sitter-go.wasm; the native addon is unused.
  tree-sitter-go: false
  esbuild: false
  '@swc/core': false
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.108.2'
  - '@tanstack/react-query@5.108.2'
  - lucide-react@1.77.0
