<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ff5'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: light dark; --bg: #f7f8fb; --fg: #1d2433; --muted: #6b7385; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14161c; --fg: #eceef3; --muted: #9aa2b3; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
      .box { text-align: center; }
      svg { width: 64px; height: 64px; animation: pulse 1.4s ease-in-out infinite; }
      p { margin: 16px 0 0; } .muted { color: var(--muted); font-size: 13px; margin-top: 4px; }
      @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.75; } }
      @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
    </style>
  </head>
  <body>
    <div class="box">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#3b6ff5"/><g fill="#fff"><rect x="7" y="7" width="8" height="8" rx="2"/><rect x="17" y="7" width="8" height="8" rx="2" opacity=".7"/><rect x="7" y="17" width="8" height="8" rx="2" opacity=".7"/><rect x="17" y="17" width="8" height="8" rx="2"/></g></svg>
      <p>Starting {{TITLE}}…</p>
      <p class="muted" id="hint">Waking up WSL and Docker</p>
    </div>
    <script>
      // Switch to the hub once it answers. An image probe needs no CORS.
      const hub = '{{HUB_URL}}';
      const started = Date.now();
      function probe() {
        const img = new Image();
        img.onload = () => location.replace(hub);
        img.onerror = () => {
          if (Date.now() - started > 90000)
            document.getElementById('hint').textContent =
              'This is taking long — details are in core.log next to the app’s settings in %LOCALAPPDATA%';
          setTimeout(probe, 500);
        };
        img.src = hub + 'favicon.svg?t=' + Date.now();
      }
      probe();
    </script>
  </body>
</html>
